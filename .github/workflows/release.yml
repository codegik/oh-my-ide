# Pushing a `v*` tag publishes a release: a GitHub release with the Linux
# tarball and the built Arch package, that package added to our own pacman
# repo, and — once the AUR takes new accounts again — the AUR package
# oh-my-ide-bin pointing at the tarball.
#
# The pacman repo is the channel we control: users add one section to
# pacman.conf and upgrade with `pacman -Syu`. The AUR has not accepted new
# registrations since the June 2026 malicious-package incident, so we cannot
# publish there yet; that job stays ready and skips until the key exists.
#
# The tag must match "version" in the root package.json. See docs/RELEASING.md.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5

      # package-manager-cache defaults to true in v5, and it caches by running
      # the manager named in package.json — pnpm, which corepack installs two
      # steps below. So the default fails before pnpm exists. The job installs
      # from a frozen lockfile and rebuilds native modules anyway, so the cache
      # buys little; not worth reordering the job around.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check the tag matches package.json
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # pnpm at the version in package.json's packageManager field.
      - run: corepack enable

      # The postinstall rebuilds node-pty and better-sqlite3 for Electron's ABI.
      - run: pnpm install --frozen-lockfile

      # pnpm can skip electron's own postinstall, which downloads the binary.
      - run: test -x node_modules/electron/dist/electron || node node_modules/electron/install.js

      - run: pnpm build

      # verify:abi and the packaged smoke test both run the Electron binary, and
      # it needs these even with ELECTRON_RUN_AS_NODE: they are linked, not
      # dlopened, so it will not start without them. Do not rely on the runner
      # image happening to have them.
      - name: Install Electron's runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-0t64 libnss3 libasound2t64 libgbm1

      # pretest runs verify:abi: the native modules must load under Electron.
      - run: pnpm test

      # Stages the release, smoke-tests the packaged daemon, then packs it.
      - name: Package
        id: package
        run: |
          pnpm package:linux
          echo "sha256=$(cut -d' ' -f1 release/*.tar.gz.sha256)" >>"$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.tar.gz.sha256 \
            --title "oh-my-ide $GITHUB_REF_NAME" --generate-notes

  # Builds the real Arch package and serves it from a pacman repo we host
  # ourselves, as assets on a release pinned to the `arch-repo` tag: every asset
  # of one release shares a URL prefix, which is all a pacman Server needs.
  pacman:
    needs: linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      GPG_PRIVATE_KEY: ${{ secrets.PACKAGE_GPG_PRIVATE_KEY }}
      VERSION: ${{ needs.linux.outputs.version }}
      SHA256: ${{ needs.linux.outputs.sha256 }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REPO_TAG: arch-repo
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git github-cli gnupg

      - uses: actions/checkout@v5

      - name: Point the PKGBUILD at this release
        run: |
          install -d build
          cp packaging/aur/oh-my-ide-bin/PKGBUILD build/PKGBUILD
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" \
                 -e "s/^pkgrel=.*/pkgrel=1/" \
                 -e "s/^sha256sums=.*/sha256sums=('$SHA256')/" build/PKGBUILD

      # makepkg refuses to run as root. Building from the URL the release just
      # published proves that URL and its checksum before any user sees them.
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder build
          su builder -c 'cd build && makepkg --nodeps --noconfirm'

      # pacman's default RemoteFileSigLevel is Required, so an unsigned package
      # is one users cannot install from a URL at all. Without the key we still
      # attach it — `pacman -U` on a downloaded file only needs Optional — but
      # the repo would be unusable, so it is skipped.
      - name: Sign the package
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "GPG_KEY_ID=$keyid" >>"$GITHUB_ENV"
          gpg --batch --yes --pinentry-mode loopback --local-user "$keyid" \
            --detach-sign --no-armor build/*.pkg.tar.zst

      - name: Skip the repo without a signing key
        if: env.GPG_PRIVATE_KEY == ''
        run: echo "::warning::PACKAGE_GPG_PRIVATE_KEY is not set; the package is attached to the release but the pacman repo was not updated"

      - name: Attach the package to the release
        run: gh release upload "$GITHUB_REF_NAME" build/*.pkg.tar.zst* --clobber

      - name: Publish it to the pacman repo
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          install -d repo
          mv build/*.pkg.tar.zst* repo/
          if gh release view "$REPO_TAG" >/dev/null 2>&1; then
            # repo-add appends to the existing database, so pull it down first.
            gh release download "$REPO_TAG" --dir repo \
              --pattern 'oh-my-ide.db.tar.gz' --pattern 'oh-my-ide.files.tar.gz' || true
          else
            gh release create "$REPO_TAG" --latest=false --title 'Arch repository' \
              --notes 'The pacman repository for oh-my-ide. See the README for the pacman.conf section that reads it. Every release adds its package here; the tag is a fixed home for the assets and does not mark a version.'
          fi
          repo-add --sign --key "$GPG_KEY_ID" repo/oh-my-ide.db.tar.gz repo/*.pkg.tar.zst
          # The key users verify the repo with, so they can import it by URL.
          gpg --armor --export "$GPG_KEY_ID" >repo/oh-my-ide.pub
          # repo-add writes oh-my-ide.db as a symlink to the tarball, which is
          # the name pacman asks for; gh uploads what it points at.
          gh release upload "$REPO_TAG" repo/* --clobber

  aur:
    needs: linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      VERSION: ${{ needs.linux.outputs.version }}
      SHA256: ${{ needs.linux.outputs.sha256 }}
    steps:
      - name: Skip without an AUR key
        if: env.AUR_SSH_PRIVATE_KEY == ''
        run: echo "::warning::AUR_SSH_PRIVATE_KEY is not set; the AUR package was not updated"

      - name: Install tools
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: pacman -Syu --noconfirm --needed git openssh

      - uses: actions/checkout@v5
        if: env.AUR_SSH_PRIVATE_KEY != ''

      - name: Set up SSH for the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >>~/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n' >~/.ssh/config

      - name: Update the PKGBUILD
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          git clone ssh://aur@aur.archlinux.org/oh-my-ide-bin.git aur
          cp packaging/aur/oh-my-ide-bin/PKGBUILD aur/PKGBUILD
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" \
                 -e "s/^pkgrel=.*/pkgrel=1/" \
                 -e "s/^sha256sums=.*/sha256sums=('$SHA256')/" aur/PKGBUILD

      # makepkg refuses to run as root. Building for real, not just printing the
      # .SRCINFO, proves the published URL and checksum before users get them.
      - name: Build it and write .SRCINFO
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          useradd -m builder
          chown -R builder aur
          su builder -c 'cd aur && makepkg --nodeps --noconfirm && makepkg --printsrcinfo >.SRCINFO'

      - name: Push to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          git config --global --add safe.directory "$PWD/aur"
          cd aur
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to $VERSION"
          git push origin HEAD:master
