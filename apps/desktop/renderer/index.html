<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>oh-my-ide</title>
<link rel="stylesheet" href="./xterm.css" />
<style>
  :root {
    --bg:#0f1115; --panel:#161922; --line:#232838; --text:#e6e9f0; --dim:#8b93a7;
    --ON_ME:#ff7a59; --ON_CLAUDE:#4ea1ff; --ON_THEM:#c08cff; --ON_SYSTEM:#ffc857; --PARKED:#5b6478;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); height:100vh; overflow:hidden;
         font:13px/1.5 "JetBrains Mono","Fira Code",ui-monospace,monospace;
         display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:0 12px; height:38px;
           border-bottom:1px solid var(--line); background:var(--panel); flex:none; }
  .brand { font-weight:700; margin-right:6px; }
  #tabs { display:flex; gap:4px; flex:1; overflow:auto; }
  .tab { display:flex; align-items:center; gap:7px; padding:4px 9px; border-radius:5px 5px 0 0;
         background:#1a1e29; color:var(--dim); cursor:pointer; white-space:nowrap; font-size:12px; }
  .tab.on { background:var(--bg); color:var(--text); box-shadow:inset 0 -2px 0 var(--ON_ME); }
  .tab .x { color:#5b6478; padding-left:3px; }
  .tab .x:hover { color:#ff5555; }
  .pill { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:999px; padding:1px 9px; }
  main { flex:1; display:grid; grid-template-columns:270px 1fr; min-height:0; }
  #rail { border-right:1px solid var(--line); overflow:auto; padding-bottom:20px; }
  .railtop { display:flex; align-items:center; justify-content:space-between;
             padding:8px 12px; border-bottom:1px solid var(--line); }
  .railtop button { background:#1d2230; color:var(--text); border:1px solid var(--line);
                    border-radius:5px; padding:3px 9px; cursor:pointer; font:inherit; font-size:11px; }
  .group { margin-top:10px; }
  .ghead { display:flex; justify-content:space-between; padding:3px 12px; color:var(--dim);
           font-size:10px; letter-spacing:.8px; }
  .titem { display:flex; align-items:center; gap:8px; padding:5px 12px; cursor:pointer; }
  .titem:hover { background:#1a1e29; }
  .titem.sel { background:#1d2230; }
  .tname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
  .tago { color:var(--dim); font-size:10px; }
  .dot { width:7px; height:7px; border-radius:50%; flex:none; background:var(--PARKED); }
  .dot.ON_ME{background:var(--ON_ME)} .dot.ON_CLAUDE{background:var(--ON_CLAUDE)}
  .dot.ON_THEM{background:var(--ON_THEM)} .dot.ON_SYSTEM{background:var(--ON_SYSTEM)}
  #detail { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .thead { padding:12px 16px 8px; border-bottom:1px solid var(--line); }
  .trow { display:flex; align-items:center; gap:12px; }
  .thead h2 { margin:0; font-size:15px; font-weight:600; flex:1; }
  .court { font-size:10px; letter-spacing:.7px; padding:2px 8px; border-radius:999px;
           cursor:pointer; background:#1d2230; }
  .court.ON_ME{color:var(--ON_ME)} .court.ON_CLAUDE{color:var(--ON_CLAUDE)}
  .court.ON_THEM{color:var(--ON_THEM)} .court.ON_SYSTEM{color:var(--ON_SYSTEM)}
  .q { color:var(--dim); font-size:12px; margin-top:3px; }
  .next { margin-top:8px; display:flex; gap:6px; align-items:center; color:var(--ON_ME); }
  .next input { flex:1; background:transparent; border:none; border-bottom:1px dashed var(--line);
                color:var(--text); font:inherit; font-size:12px; padding:2px 0; outline:none; }
  .body { flex:1; display:grid; grid-template-columns:1fr 300px; min-height:0; }
  .left { display:flex; flex-direction:column; min-width:0; min-height:0; border-right:1px solid var(--line); }
  .termwrap { flex:1; min-height:0; background:#0b0d12; padding:6px; }
  .termhost { width:100%; height:100%; }
  .termbar { display:flex; align-items:center; justify-content:space-between; gap:8px;
             padding:5px 10px; border-top:1px solid var(--line); font-size:11px; }
  .termbar button, .termbar select { background:#1d2230; color:var(--text); border:1px solid var(--line);
             border-radius:5px; padding:3px 8px; font:inherit; font-size:11px; cursor:pointer; }
  .side { overflow:auto; display:flex; flex-direction:column; }
  .shead { padding:8px 12px 4px; color:var(--dim); font-size:10px; letter-spacing:.8px; }
  .ref { display:flex; align-items:center; gap:6px; padding:4px 12px; font-size:11px; }
  .ref:hover { background:#1a1e29; }
  .rk { color:var(--dim); min-width:78px; }
  .rl { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rs { color:var(--ON_SYSTEM); font-size:10px; }
  .go, .rm { cursor:pointer; color:var(--dim); }
  .go:hover { color:var(--ON_CLAUDE); } .rm:hover { color:#ff5555; }
  .side input { margin:6px 12px; background:#0b0d12; border:1px solid var(--line); border-radius:5px;
                color:var(--text); font:inherit; font-size:11px; padding:4px 7px; outline:none; }
  .timeline { padding:0 12px; }
  .ev { display:flex; gap:8px; font-size:11px; padding:2px 0; }
  .evt { color:var(--dim); min-width:30px; }
  .evb { flex:1; color:#c9cfdd; }
  .muted { color:var(--dim); } .pad { padding:4px 12px; font-size:11px; }
  .empty { color:var(--dim); padding:40px 22px; text-align:center; }
  #newtrack { width:calc(100% - 24px); margin:6px 12px; background:#0b0d12; border:1px solid var(--line);
              border-radius:5px; color:var(--text); font:inherit; font-size:11px; padding:4px 7px; outline:none; }
  #why { position:fixed; right:320px; top:80px; z-index:50; width:280px; background:var(--panel);
         border:1px solid var(--line); border-radius:8px; padding:10px 12px;
         box-shadow:0 12px 40px rgba(0,0,0,.6); font-size:11px; }
  .whyhead { font-weight:600; margin-bottom:7px; }
  .whyrow { display:flex; justify-content:space-between; color:var(--dim); }
  .whyreason { margin:8px 0; color:#c9cfdd; }
  .whyacts { display:flex; flex-wrap:wrap; gap:5px; }
  .whyacts button { background:#1d2230; color:var(--text); border:1px solid var(--line);
                    border-radius:5px; padding:3px 7px; font:inherit; font-size:10px; cursor:pointer; }
</style>
</head>
<body>
  <header>
    <span class="brand">◉ oh-my-ide</span>
    <div id="tabs"></div>
    <span class="pill" id="daemon">connecting…</span>
  </header>
  <main>
    <div id="rail">
      <div class="railtop"><span class="muted" style="font-size:10px;letter-spacing:.8px">TRACKS</span>
        <button id="new">+ new</button></div>
      <input id="newtrack" hidden placeholder="a question works best…" />
      <div id="railbody"></div>
    </div>
    <div id="detail"></div>
  </main>
  <div id="why" hidden></div>
  </main>
  <script src="./bundle.js"></script>
</body>
</html>
